#Clase 1:
spring.application.name=tienda
server.port=8081

#Clase 2:
logging.pattern.dateformat=hh:mm
spring.main.banner-mode=off
spring.thymeleaf.cache=false

#Clase 3:
spring.datasource.url=jdbc:mysql://localhost:3306/tecshop
spring.datasource.username=root
spring.datasource.password=root
#Driver y plataforma de comunicación
spring.datasource.driver-cass-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
#Mostrar información en el log
spring.jpa.properties.hibernate.format_sql=true
loggin.level.org.hibernate.SQL=DEBUG
loggin.level.org.type.descriptor.sql.BasicBinder=TRACE

#Clase 4:
#Esta información se utiliza para obtener acceso a su storage.
firebase.bucket.name=techshop-b17a5.firebasestorage.app
firebase.storage.path=tecshop
firebase.json.path=firebase
# Va el link o la clave de firebase:
firebase.json.file=techshop-b17a5-firebase-adminsdk-fbsvc-8a3f9971c5.json

